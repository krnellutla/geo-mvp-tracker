name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --check app.js
      - run: for f in api/*.js; do node --check "$f"; done
      - run: node -e "JSON.parse(require('fs').readFileSync('data/tracker.json','utf8'))"
